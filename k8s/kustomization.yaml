---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - deployment.yaml
  - service.yaml
  - servicemonitor.yaml
  - externalsecret.yaml
  - prometheusrule.yaml
  - grafana-dashboards.yaml
  - ingressroute.yaml

# Note: GrafanaDashboard CRs now use 'url' to fetch dashboard JSON directly
# from raw GitHub URLs, avoiding path issues with ArgoCD and eliminating
# the need for configMapGenerator
