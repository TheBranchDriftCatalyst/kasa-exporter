---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kasa-credentials
  namespace: monitoring
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore

  target:
    name: kasa-credentials
    creationPolicy: Owner
    template:
      metadata:
        labels:
          app: kasa-exporter
      type: Opaque

  data:
    - secretKey: username
      remoteRef:
        key: kasa-credentials
        property: username

    - secretKey: password
      remoteRef:
        key: kasa-credentials
        property: password
