---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kasa-exporter
  namespace: monitoring
  labels:
    app: kasa-exporter
    app.kubernetes.io/name: kasa-exporter
    app.kubernetes.io/component: exporter
    app.kubernetes.io/part-of: monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate # Only one instance should run due to hostNetwork
  selector:
    matchLabels:
      app: kasa-exporter
  template:
    metadata:
      labels:
        app: kasa-exporter
        app.kubernetes.io/name: kasa-exporter
        app.kubernetes.io/component: exporter
      # Note: Scraped via ServiceMonitor (not pod annotations) to avoid duplicate metrics
    spec:
      automountServiceAccountToken: false
      # Required for mDNS device discovery - gives pod access to host network
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: kasa-exporter
          image: ghcr.io/thebranchdriftcatalyst/kasa-exporter@sha256:172afffa7d595aec2cd80d105943d80b849a28665a3a108509c0d69d1902b33e
          imagePullPolicy: Always
          env:
            - name: KASA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: kasa-credentials
                  key: username
            - name: KASA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kasa-credentials
                  key: password
            - name: METRICS_PORT
              value: "9200"
            - name: LOG_LEVEL
              value: "INFO"
            - name: TZ
              value: "America/Los_Angeles"
            - name: KASA_DISCOVERY_TARGET
              value: "192.168.1.255"
            - name: LOG_FORMAT
              value: "json"
          ports:
            - name: metrics
              containerPort: 9200
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Sized for P95 usage (~10m CPU, ~45Mi memory)
          resources:
            requests:
              cpu: 15m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              add:
                - NET_RAW # Required for mDNS multicast
              drop:
                - ALL
