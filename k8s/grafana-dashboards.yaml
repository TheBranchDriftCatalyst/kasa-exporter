---
# GrafanaDashboard CRs for kasa-exporter
# These reference ConfigMaps containing the dashboard JSON
# The ConfigMaps are generated from etc/grafana/provisioning/dashboards/dashboards/

apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: kasa-real-time-monitoring
  namespace: monitoring
  labels:
    app: kasa-exporter
spec:
  # Reference the Grafana instance
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  # Reference dashboard from ConfigMap
  configMapRef:
    name: kasa-dashboard-real-time-monitoring
    key: dashboard.json
  # Folder to organize dashboards
  folder: "Kasa"
