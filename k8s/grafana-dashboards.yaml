---
# GrafanaDashboard CRs for kasa-exporter
# These fetch dashboard JSON from raw GitHub URLs
# This approach avoids path issues with ArgoCD and keeps dashboards in their source location

apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: kasa-real-time-monitoring
  namespace: monitoring
  labels:
    app: kasa-exporter
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  url: "https://raw.githubusercontent.com/TheBranchDriftCatalyst/kasa-exporter/main/etc/grafana/provisioning/dashboards/dashboards/1-real-time-monitoring.json?v=20260908-audit2"
  folder: "Kasa"
