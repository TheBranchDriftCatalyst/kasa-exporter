# Canonical rules. Fixed30s evaluation; dashboard integrals resample explicitly.
groups:
  - name: kasa_tou_metrics
    interval: 30s
    rules:
      - record: kasa:consumption_cost_with_rate_class
        expr:
          max by (device_id, alias, version) (consumption_cost{job="kasa-exporter"}) * on(device_id, version) group_left(rate_class,
          season) (max by (device_id, alias, version, season, rate_class) (current_energy_rate{job="kasa-exporter"})
          * 0 + 1)
      - record: kasa:consumption_cost:total
        expr: sum by(version) (max by (device_id, alias, version) (consumption_cost{job="kasa-exporter"}))
      - record: kasa:consumption_cost:by_rate_class
        expr: sum by(version, rate_class) (kasa:consumption_cost_with_rate_class)
      - record: kasa:consumption_cost:by_device
        expr: max by (device_id, alias, version) (consumption_cost{job="kasa-exporter"})
      - record: kasa:consumption_cost:by_device_and_rate_class
        expr: sum by(device_id, alias, version, rate_class) (kasa:consumption_cost_with_rate_class)
      - record: kasa:current_consumption:total
        expr: sum by(version) (max by (device_id, alias, version) (current_consumption{job="kasa-exporter"}))
      - record: kasa:current_consumption:by_device
        expr: max by (device_id, alias, version) (current_consumption{job="kasa-exporter"})
      - record: kasa:cost_efficiency:by_device
        expr: kasa:consumption_cost:by_device / (kasa:current_consumption:by_device > 0) * 1000
      - record: kasa:power_utilization:by_device
        expr: kasa:current_consumption:by_device / on(version) group_left() (kasa:current_consumption:total > 0) * 100
      - record: kasa:consumption_cost:avg_5m
        expr: avg_over_time(kasa:consumption_cost:total[5m])
      - record: kasa:consumption_cost:avg_1h
        expr: avg_over_time(kasa:consumption_cost:total[1h])
      - record: kasa:consumption_cost:avg_24h
        expr: avg_over_time(kasa:consumption_cost:total[24h])
      - record: kasa:current_consumption:avg_5m
        expr: avg_over_time(kasa:current_consumption:total[5m])
      - record: kasa:current_consumption:avg_1h
        expr: avg_over_time(kasa:current_consumption:total[1h])
      - record: kasa:current_energy_rate:current
        expr: max by(version, season, rate_class) (current_energy_rate{job="kasa-exporter"})
      - record: kasa:rate_class:numeric
        expr:
          (kasa:current_energy_rate:current{rate_class="super_off_peak"} * 0 + 1) or (kasa:current_energy_rate:current{rate_class="off_peak"}
          * 0 + 2) or (kasa:current_energy_rate:current{rate_class="on_peak"} * 0 + 3)
      - record: kasa:consumption_cost:projected_hour
        expr: kasa:consumption_cost:total * 1
      - record: kasa:consumption_cost:projected_day
        expr: kasa:consumption_cost:total * 24
      - record: kasa:consumption_cost:projected_month
        expr: kasa:consumption_cost:total * 730
      - record: kasa:consumption_cost:potential_savings_super_off_peak
        expr:
          clamp_min(kasa:consumption_cost:total - kasa:current_consumption:total / 1000 * scalar((max by(season) (kasa_tariff_usd_per_kwh{job="kasa-exporter",rate_class="super_off_peak"})
          and on(season) kasa:current_energy_rate:current)), 0)
      - record: kasa:consumption_cost:potential_savings_off_peak
        expr:
          clamp_min(kasa:consumption_cost:total - kasa:current_consumption:total / 1000 * scalar((max by(season) (kasa_tariff_usd_per_kwh{job="kasa-exporter",rate_class="off_peak"})
          and on(season) kasa:current_energy_rate:current)), 0)
      - record: kasa:consumption_cost:stddev_1h
        expr: stddev_over_time(kasa:consumption_cost:total[1h])
      - record: kasa:consumption_cost:zscore
        expr:
          ((kasa:consumption_cost:total - kasa:consumption_cost:avg_1h) / (kasa:consumption_cost:stddev_1h > 0)) or (kasa:consumption_cost:stddev_1h
          == 0)
      - record: kasa:consumption_cost:anomaly
        expr: abs(kasa:consumption_cost:zscore) > bool 2
  - name: kasa_exporter_health
    interval: 30s
    rules:
      - alert: KasaExporterScrapeMissing
        expr: absent(up{job="kasa-exporter"}) or (max(up{job="kasa-exporter"}) == 0)
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Kasa exporter is not being scraped
          description: No working Kasa scrape target exists; power and cost readings are unavailable.
      - alert: KasaExporterNoFreshDevices
        expr:
          (max(kasa_fresh_devices{job="kasa-exporter"}) == 0) or (time() - max(kasa_last_measurement_timestamp_seconds{job="kasa-exporter"})
          > 90)
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Kasa exporter has no fresh device measurements
          description:
            An HTTP200 metrics response does not prove device collection works. Check discovery, credentials,
            protocol support and LAN connectivity.
      - alert: KasaUnsupportedDeviceProtocol
        expr: max(kasa_discovery_unsupported_devices{job="kasa-exporter"}) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Kasa device firmware uses an unsupported protocol
          description: Discovery receives devices that the installed library cannot handle.
