[tool.poetry]
name = "kasa"
version = "1.0.0"
description = ""
authors = ["TheBranchDriftCatalyst <djdanielsh@gmail.com>"]
readme = "README.md"
packages = [{include = "kasa_exporter"}]

[tool.poetry.dependencies]
python = "^3.12"
prometheus-client = "^0.20.0"
structlog = "^24.4.0"
python-kasa = "^0.7.0.5"
requests = "^2.32.3"
watchdog = "^6.0.0"
fastapi = "^0.136.0"
pytz = "^2024.1"
jsonpickle = "^3.2.2"
twisted = "^24.3.0"
uvicorn = {extras = ["standard"], version = "^0.38.0"}
pillow = "^12.0.0"
numpy = "^2.3.4"
protobuf = "^6.33.0"
python-snappy = "^0.7.3"
scipy = "^1.16.3"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "playwright (>=1.55.0,<2.0.0)",
    "pytest (>=8.4.2,<9.0.0)",
    "pytest-asyncio (>=1.2.0,<2.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "ruff (>=0.14.2,<0.15.0)",
    "mypy (>=1.18.2,<2.0.0)",
    "types-pyyaml (>=6.0.12.20250915,<7.0.0.0)",
    "types-pytz (>=2025.2.0.20250809,<2026.0.0.0)",
    "types-requests (>=2.32.4.20250913,<3.0.0.0)"
]

[tool.ruff]
# Sexy ruff config for clean, fast Python
line-length = 100
target-version = "py312"
fix = true

[tool.ruff.lint]
# Enable all the good stuff
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "PIE",    # flake8-pie
    "PT",     # flake8-pytest-style
    "RET",    # flake8-return
    "SIM",    # flake8-simplify
    "PTH",    # flake8-use-pathlib
    "PL",     # pylint
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "PLR0913", # too many arguments
    "PLR2004", # magic value in comparison
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "PLR2004",  # Magic values are fine in tests
    "S101",     # Assert is fine in tests
    "DTZ001",   # datetime without tzinfo is fine in tests (mocked)
    "DTZ005",   # datetime.now without tz is fine in tests (mocked)
    "PT009",    # unittest assertions are fine in tests
    "PT006",    # pytest.mark.parametrize tuple format varies
    "SIM117",   # Nested with statements are fine in tests
]
"**/tests/**/*.py" = [
    "PLR2004",  # Magic values are fine in tests
    "S101",     # Assert is fine in tests
    "DTZ001",   # datetime without tzinfo is fine in tests (mocked)
    "DTZ005",   # datetime.now without tz is fine in tests (mocked)
    "PT009",    # unittest assertions are fine in tests
    "PT006",    # pytest.mark.parametrize tuple format varies
    "SIM117",   # Nested with statements are fine in tests
]

[tool.ruff.format]
# Use double quotes and trailing commas
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["kasa_exporter"]

[tool.pytest.ini_options]
testpaths = ["kasa_exporter"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short --cov=kasa_exporter --cov-report=term-missing"
