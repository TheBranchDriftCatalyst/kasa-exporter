services:
  kasa_exporter:
    build:
      context: .
    ports:
      - '9201:9201'
    volumes:
      - ./etc:/app/etc
    environment:
      - KASA_USERNAME
      - KASA_PASSWORD
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - METRICS_PORT=9201
    network_mode: host
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9201/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # cap_add:
    #   - NET_ADMIN
    # networks:
    #  - mdsn_net
    # develop:
    #   watch:
    #     - action: sync
    #       path: ./kasa_exporter
    #       target: /app/kasa_exporter
    # ignore:
    # - node_modules/
    # - action: rebuild
    # path: package.json

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./etc/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./etc/prometheus/rules:/etc/prometheus/rules
      - ./.promdb:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - '9090:9090'
    network_mode: host

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    volumes:
      - ./etc/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./etc/grafana/provisioning/dashboard.yaml:/etc/grafana/provisioning/dashboards/dashboard.yaml
      - ./etc/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - grafana-storage:/var/lib/grafana
    ports:
      - '3000:3000'
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_RENDERING_SERVER_URL=http://localhost:8081/render
      - GF_RENDERING_CALLBACK_URL=http://localhost:3000/
      - GF_LOG_FILTERS=rendering:debug,provisioning.dashboard:debug
      - GF_LOG_LEVEL=debug
      - GF_FEATURE_TOGGLES_ENABLE=
      # - GF_FEATURE_TOGGLES_DISABLE=dashboardScene,dashboardSceneSolo,dashboardSceneForViewers
    network_mode: host
    depends_on:
      - prometheus
      - renderer

  renderer:
    image: grafana/grafana-image-renderer:latest
    container_name: grafana-renderer
    ports:
      - '8081:8081'
    environment:
      - ENABLE_METRICS=true
    network_mode: host

  pushgateway:
    image: prom/pushgateway:latest
    container_name: pushgateway
    ports:
      - '9091:9091'
    network_mode: host

volumes:
  grafana-storage:
