services:

  kasa_exporter:
    build:
      context: .
    ports:
      - "8000:8000"
    environment:
      - KASA_USERNAME
      - KASA_PASSWORD
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    network_mode: host
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # cap_add:
    #   - NET_ADMIN
    # networks:
    #  - mdsn_net
    # develop:
    #   watch:
    #     - action: sync
    #       path: ./kasa_exporter
    #       target: /app/kasa_exporter
          # ignore:
            # - node_modules/
        # - action: rebuild
          # path: package.json

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./etc/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    network_mode: host

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    volumes:
      - ./etc/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./etc/grafana/dashboard.yaml:/etc/grafana/provisioning/dashboards/main.yaml
      # - ./etc/grafana/dashboards:/var/lib/grafana/dashboards
      - ./etc/grafana/dashboards:/etc/grafana/provisioning/dashboards
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_RENDERING_SERVER_URL=http://localhost:8081/render
      - GF_RENDERING_CALLBACK_URL=http://localhost:3000/
      - GF_LOG_FILTERS=rendering:debug
    network_mode: host
    depends_on:
      - prometheus
      - renderer

  renderer:
    image: grafana/grafana-image-renderer:latest
    container_name: grafana-renderer
    ports:
      - "8081:8081"
    environment:
      - ENABLE_METRICS=true
    network_mode: host

  pushgateway:
    image: prom/pushgateway:latest
    container_name: pushgateway
    ports:
      - "9091:9091"
    network_mode: host
