rule_files:
  - ../etc/prometheus/rules/kasa_rules.yml
evaluation_interval: 30s
tests:
  - interval: 30s
    input_series:
      - series: current_consumption{device_id="a",alias="same-name",version="v1",job="kasa-exporter",instance="one"}
        values: 1000+0x120
      - series: consumption_cost{device_id="a",alias="same-name",version="v1",job="kasa-exporter",instance="one"}
        values: 0.3+0x120
      - series: current_energy_rate{device_id="a",alias="same-name",version="v1",job="kasa-exporter",instance="one",season="summer",rate_class="off_peak"}
        values: 0.3+0x120
      - series: current_consumption{device_id="a",alias="same-name",version="v1",job="kasa-exporter",instance="duplicate"}
        values: 1000+0x120
      - series: consumption_cost{device_id="a",alias="same-name",version="v1",job="kasa-exporter",instance="duplicate"}
        values: 0.3+0x120
      - series: current_energy_rate{device_id="a",alias="same-name",version="v1",job="kasa-exporter",instance="duplicate",season="summer",rate_class="off_peak"}
        values: 0.3+0x120
      - series: current_consumption{device_id="b",alias="same-name",version="v1",job="kasa-exporter",instance="one"}
        values: 2000+0x120
      - series: consumption_cost{device_id="b",alias="same-name",version="v1",job="kasa-exporter",instance="one"}
        values: 0.6+0x120
      - series: current_energy_rate{device_id="b",alias="same-name",version="v1",job="kasa-exporter",instance="one",season="summer",rate_class="off_peak"}
        values: 0.3+0x120
      - series: current_consumption{device_id="b",alias="same-name",version="v1",job="kasa-exporter",instance="duplicate"}
        values: 2000+0x120
      - series: consumption_cost{device_id="b",alias="same-name",version="v1",job="kasa-exporter",instance="duplicate"}
        values: 0.6+0x120
      - series: current_energy_rate{device_id="b",alias="same-name",version="v1",job="kasa-exporter",instance="duplicate",season="summer",rate_class="off_peak"}
        values: 0.3+0x120
      - series: kasa_tariff_usd_per_kwh{job="kasa-exporter",season="summer",rate_class="super_off_peak"}
        values: 0.1+0x120
    promql_expr_test:
      - expr: kasa:current_consumption:total
        eval_time: 1h
        exp_samples:
          - labels: kasa:current_consumption:total{version="v1"}
            value: 3000
      - expr: kasa:consumption_cost:total
        eval_time: 1h
        exp_samples:
          - labels: kasa:consumption_cost:total{version="v1"}
            value: 0.8999999999999999
      - expr: sum(kasa:consumption_cost_with_rate_class)
        eval_time: 1h
        exp_samples:
          - labels: "{}"
            value: 0.8999999999999999
      - expr: round(sum(kasa:power_utilization:by_device), 0.000001)
        eval_time: 1h
        exp_samples:
          - labels: "{}"
            value: 100
      - expr: min(kasa:cost_efficiency:by_device)
        eval_time: 1h
        exp_samples:
          - labels: "{}"
            value: 0.3
      - expr: kasa:consumption_cost:anomaly
        eval_time: 1h
        exp_samples:
          - labels: kasa:consumption_cost:anomaly{version="v1"}
            value: 0
      - expr:
          (sum_over_time(kasa:consumption_cost:total[1h:30s]) - last_over_time(kasa:consumption_cost:total[1h:30s]))
          * 30 / 3600
        eval_time: 1h
        exp_samples:
          - labels: '{version="v1"}'
            value: 0.8999999999999999
      - expr: count(kasa:consumption_cost:zscore != kasa:consumption_cost:zscore)
        eval_time: 1h
        exp_samples: []
      - expr:
          round(((clamp_min(predict_linear(kasa:current_consumption:total{version=~"v1"}[1h], 3600), 0)) and on(version)
          (count_over_time(kasa:current_consumption:total{version=~"v1"}[1h]) >= 96)), 0.000001)
        eval_time: 30s
        exp_samples: []
      - expr:
          round(((clamp_min(predict_linear(kasa:current_consumption:total{version=~"v1"}[1h], 3600), 0)) and on(version)
          (count_over_time(kasa:current_consumption:total{version=~"v1"}[1h]) >= 96)), 0.000001)
        eval_time: 1h
        exp_samples:
          - labels: '{version="v1"}'
            value: 3000
  - name: http-up-but-no-devices
    interval: 30s
    input_series:
      - series: up{job="kasa-exporter"}
        values: 1+0x10
      - series: kasa_fresh_devices{job="kasa-exporter"}
        values: 0+0x10
      - series: kasa_last_measurement_timestamp_seconds{job="kasa-exporter"}
        values: 0+30x10
      - series: kasa_discovery_unsupported_devices{job="kasa-exporter"}
        values: 0+0x10
    alert_rule_test:
      - eval_time: 3m
        alertname: KasaExporterScrapeMissing
        exp_alerts: []
      - eval_time: 3m
        alertname: KasaExporterNoFreshDevices
        exp_alerts:
          - exp_labels: &id001
              severity: warning
            exp_annotations: &id002
              summary: Kasa exporter has no fresh device measurements
              description:
                An HTTP200 metrics response does not prove device collection works. Check discovery, credentials,
                protocol support and LAN connectivity.
      - eval_time: 3m
        alertname: KasaUnsupportedDeviceProtocol
        exp_alerts: []
  - name: fresh-collection
    interval: 30s
    input_series:
      - series: up{job="kasa-exporter"}
        values: 1+0x10
      - series: kasa_fresh_devices{job="kasa-exporter"}
        values: 5+0x10
      - series: kasa_last_measurement_timestamp_seconds{job="kasa-exporter"}
        values: 0+30x10
      - series: kasa_discovery_unsupported_devices{job="kasa-exporter"}
        values: 0+0x10
    alert_rule_test:
      - eval_time: 3m
        alertname: KasaExporterScrapeMissing
        exp_alerts: []
      - eval_time: 3m
        alertname: KasaExporterNoFreshDevices
        exp_alerts: []
      - eval_time: 3m
        alertname: KasaUnsupportedDeviceProtocol
        exp_alerts: []
  - name: unsupported-firmware
    interval: 30s
    input_series:
      - series: up{job="kasa-exporter"}
        values: 1+0x10
      - series: kasa_fresh_devices{job="kasa-exporter"}
        values: 0+0x10
      - series: kasa_last_measurement_timestamp_seconds{job="kasa-exporter"}
        values: 0+30x10
      - series: kasa_discovery_unsupported_devices{job="kasa-exporter"}
        values: 1+0x10
    alert_rule_test:
      - eval_time: 3m
        alertname: KasaExporterScrapeMissing
        exp_alerts: []
      - eval_time: 3m
        alertname: KasaExporterNoFreshDevices
        exp_alerts:
          - exp_labels: *id001
            exp_annotations: *id002
      - eval_time: 3m
        alertname: KasaUnsupportedDeviceProtocol
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Kasa device firmware uses an unsupported protocol
              description: Discovery receives devices that the installed library cannot handle.
  - name: battery-charge-discharge-energy-balance
    interval: 30s
    input_series:
      - series: current_consumption{job="kasa-exporter",version="v1",alias="test",device_id="test"}
        values: 3000+0x240
    promql_expr_test:
      - expr:
          round((clamp_min(100 - ((sum_over_time((sum(max by(device_id,alias,version)(current_consumption{job="kasa-exporter",alias=~".*",version=~".*"}))
          and on() (vector(time()) >= 0))[7200s:30s]) - last_over_time((sum(max by(device_id,alias,version)(current_consumption{job="kasa-exporter",alias=~".*",version=~".*"}))
          and on() (vector(time()) >= 0))[7200s:30s])) * 30 / 3600) / (48 * 200 * 0.90) * 100, 0)), 0.000001)
        eval_time: 2h
        exp_samples:
          - labels: "{}"
            value: 30.555556
      - expr: round((clamp_max(((400 * 0.90) * clamp_min(vector(time() - 0), 0) / 3600) / (48 * 200) * 100, 100)), 0.000001)
        eval_time: 2h
        exp_samples:
          - labels: "{}"
            value: 7.5
      - expr:
          round((clamp_max(clamp_min(100 + (((400 * 0.90) * clamp_min(vector(time() - 0), 0) / 3600) - (((sum_over_time((sum(max
          by(device_id,alias,version)(current_consumption{job="kasa-exporter",alias=~".*",version=~".*"})) and on()
          (vector(time()) >= 0))[7200s:30s]) - last_over_time((sum(max by(device_id,alias,version)(current_consumption{job="kasa-exporter",alias=~".*",version=~".*"}))
          and on() (vector(time()) >= 0))[7200s:30s])) * 30 / 3600) / 0.90)) / (48 * 200) * 100, 0), 100)), 0.000001)
        eval_time: 2h
        exp_samples:
          - labels: "{}"
            value: 38.055556
      - expr: round((vector((1 - 0.8) * 100)), 0.000001)
        eval_time: 2h
        exp_samples:
          - labels: "{}"
            value: 20
  - name: zero-baseline-does-not-produce-NaN
    interval: 30s
    input_series:
      - series: current_consumption{job="kasa-exporter",device_id="zero",alias="zero",version="v1"}
        values: 0+0x10
      - series: current_consumption{job="kasa-exporter",device_id="load",alias="load",version="v1"}
        values: 100+0x10
      - series: consumption_cost{job="kasa-exporter",device_id="zero",alias="zero",version="v1"}
        values: 0+0x10
      - series: consumption_cost{job="kasa-exporter",device_id="load",alias="load",version="v1"}
        values: 0.03+0x10
    promql_expr_test:
      - expr:
          (kasa:current_consumption:by_device{version=~"v1", alias=~"zero"} / on() group_left() (sum(kasa:current_consumption:by_device{version=~"v1",
          alias=~"zero"}) > 0) * 100) + 0
        eval_time: 3m
        exp_samples: []
      - expr:
          (kasa:current_consumption:by_device{version=~"v1", alias=~".*"} / on() group_left() (sum(kasa:current_consumption:by_device{version=~"v1",
          alias="zero"}) > 0) * 100) + 0
        eval_time: 3m
        exp_samples: []
      - expr:
          (kasa:consumption_cost:by_device{version=~"v1", alias=~".*"} / on() group_left() (sum(kasa:consumption_cost:by_device{version=~"v1",
          alias="zero"}) > 0) * 100) + 0
        eval_time: 3m
        exp_samples: []
